[metadata]
name = pencil2d-mcp
version = 0.2.0
author = chriz-3656
license = MIT
license_files = LICENSE
description = Model Context Protocol (MCP) server for Pencil2D animation
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/chriz-3656/pencil2d-mcp

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    Pillow>=8.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    pencil2d-mcp = pencil2d_mcp.cli:main
